name: Deploy VVH PWA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vvh-js
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      # Publiek bereikbaar voor GitHub Actions (nginx → poort 3003)
      HOST: vvh.clvs.nl
      USERNAME: root
      TARGET_DIR: /var/www/vvh-js
      APP_NAME: vvh-js
      PORT: "3003"
      NODE_VERSION: "20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          BRANCH: ${{ github.ref_name }}
          PROXY_URL: ${{ secrets.NEXT_PUBLIC_PROXY_BASE_URL }}
        run: |
          ssh -o StrictHostKeyChecking=no "${USERNAME}@${HOST}" bash -s <<REMOTE_SCRIPT
          set -euo pipefail

          export TARGET_DIR="${TARGET_DIR}"
          export APP_NAME="${APP_NAME}"
          export PORT="${PORT}"
          export BRANCH="${BRANCH}"
          export PROXY_URL="${PROXY_URL}"
          export NODE_VERSION="${NODE_VERSION}"

          export NVM_DIR="/root/.nvm"
          if [ -s "\$NVM_DIR/nvm.sh" ]; then
            . "\$NVM_DIR/nvm.sh"
            nvm use "\$NODE_VERSION" || nvm use --lts
          else
            export PATH="/root/.nvm/versions/node/v20.12.0/bin:\$PATH"
          fi

          echo "Node: \$(node -v)"
          echo "npm: \$(npm -v)"

          mkdir -p "\$TARGET_DIR"
          cd "\$TARGET_DIR"

          if [ ! -d .git ]; then
            echo "ERROR: Repository niet gevonden in \$TARGET_DIR"
            echo "Eenmalig op de server:"
            echo "  git clone git@github.com:boerdb/vvh-js.git \$TARGET_DIR"
            exit 1
          fi

          git fetch origin "\$BRANCH"
          git reset --hard "origin/\$BRANCH"

          if [ -n "\$PROXY_URL" ]; then
            printf '%s\n' "NEXT_PUBLIC_PROXY_BASE_URL=\$PROXY_URL" > .env.local
          elif [ ! -f .env.local ]; then
            echo "ERROR: CORS-proxy vereist — zet GitHub secret NEXT_PUBLIC_PROXY_BASE_URL"
            exit 1
          fi

          export NODE_ENV=production
          npm ci
          npm run build

          if pm2 describe "\$APP_NAME" > /dev/null 2>&1; then
            echo "Herstart \$APP_NAME"
            pm2 restart ecosystem.config.cjs --update-env
          else
            echo "Start \$APP_NAME"
            pm2 start ecosystem.config.cjs
          fi

          pm2 save
          pm2 status "\$APP_NAME"
          REMOTE_SCRIPT
