name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests rekenen met Nederlandse tijd, net als de Nevobo-feeds.
      TZ: Europe/Amsterdam
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # Node 24 (npm 11), zelfde als de server; de lockfile is met npm 11 gemaakt.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
