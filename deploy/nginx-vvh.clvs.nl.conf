# vvh.clvs.nl — reverse proxy naar Next.js (PM2 poort 3003)
#
# Op de server:
#   sudo cp deploy/nginx-vvh.clvs.nl.conf /etc/nginx/sites-available/vvh.clvs.nl
#   sudo ln -sf /etc/nginx/sites-available/vvh.clvs.nl /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_x_forwarded_proto $vvh_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream vvh_next {
    server 127.0.0.1:3003;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name vvh.clvs.nl;

    access_log /var/log/nginx/vvh.clvs.nl.access.log;
    error_log  /var/log/nginx/vvh.clvs.nl.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        proxy_pass http://vvh_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $vvh_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;

        proxy_redirect off;
    }
}
